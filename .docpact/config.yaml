version: 1
layout: repo
# Review note, 2026-09-07: #187 adds the immutable v0.3.0 request for exact bbccee6; source, runtime, platform and ownership invariants are unchanged.
lastReviewedAt: "2026-09-15"
lastReviewedCommit: "37ce8602fb8aec00fd182f8e2976f7911ff783c4"
lastReviewedNote: "Reviewed for #193 after cold CI34935796586: four native platforms, package dry-run, aggregation and Winget pass; composite installation/context and cache saves are verified. Native action50/50/62/411s; warm comparison and root integration remain pending. Runtime/CLI/authorization unchanged."
# Reviewed for Issue #177: macOS Intel is retired from the required native
# matrix; Linux x86_64/ARM64, macOS Apple Silicon, and Windows x86_64 remain,
# and ownership/routing/validation governance is otherwise unchanged.

catalog:
  repos:
    - id: tidas-tools
      path: .
      canonicalRepo: tiangong-lca/tidas-toolkit
      entryDoc: AGENTS.md
      workflowDocs:
        - docs/agents/repo-validation.md
        - docs/agents/repo-architecture.md
        - docs/agents/cli-contract.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - README_CN.md
          - .docpact/config.yaml
          - docs/agents/**
          - migration/**
          - packaging/README.md
          - .github/workflows/ai-doc-lint.yml
      ownerRepo: tidas-tools
    - id: rust-product
      paths:
        include:
          - Cargo.toml
          - Cargo.lock
          - crates/**
          - contracts/**
      ownerRepo: tidas-tools
    - id: executable-assets
      paths:
        include:
          - assets/**
          - .gitattributes
      ownerRepo: tidas-tools
    - id: native-distribution
      paths:
        include:
          - LICENSE
          - packaging/**
          - .github/releases/**
          - scripts/install.sh
          - scripts/install.ps1
          - scripts/publish-crates.sh
          - scripts/sync-rust-package-assets.sh
          - scripts/test-release-request.sh
          - scripts/validate-release-request.sh
          - scripts/validate-final-python-line.sh
          - .github/workflows/release-request.yml
          - .github/workflows/rust-release.yml
          - .github/actions/native-xml/**
          - scripts/native-cache-contract.sh
          - scripts/test-native-cache.sh
          - scripts/test-publish-target.sh
      ownerRepo: tidas-tools
    - id: tests-and-automation
      paths:
        include:
          - test_data/**
          - scripts/audit-rust-only.sh
          - .github/workflows/rust-ci.yml
          - .github/workflows/dispatch-tidas-sdk-sync.yml
      ownerRepo: tidas-tools
    - id: local-docpact-push-gate
      paths:
        include:
          - .githooks/**
          - scripts/docpact
          - scripts/docpact-gate.sh
          - scripts/install-git-hooks.sh
          - scripts/pre-push-deletion-only.sh
          - scripts/test-pre-push.sh
      ownerRepo: tidas-tools

coverage:
  include:
    - AGENTS.md
    - README.md
    - README_CN.md
    - LICENSE
    - .gitattributes
    - .docpact/config.yaml
    - .githooks/**
    - .github/releases/**
    - .github/workflows/**
    - .github/actions/native-xml/**
    - docs/agents/**
    - migration/**
    - packaging/**
    - Cargo.toml
    - Cargo.lock
    - crates/**
    - contracts/**
    - assets/**
    - scripts/**
    - test_data/**
  exclude:
    - .git/**
    - .github/scripts/**
    - .docpact/runs/**
    - target/**
    - build/**
    - dist/**

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    tidas-tools:
      paths:
        - AGENTS.md
        - docs/agents/repo-architecture.md
        - docs/agents/repo-validation.md
        - docs/agents/cli-contract.md
        - Cargo.toml
        - crates/**
        - contracts/**
        - assets/**
    tool-runtime:
      paths:
        - docs/agents/cli-contract.md
        - Cargo.toml
        - Cargo.lock
        - crates/**
        - contracts/**
    conversion:
      paths:
        - crates/tidas-cli/**
        - crates/tidas-conversion/**
        - crates/tidas-contracts/**
        - crates/tidas-references/**
        - crates/tidas-runtime/**
        - crates/tidas-xml/**
        - assets/**
    import:
      paths:
        - crates/tidas-cli/**
        - crates/tidas-conversion/**
        - crates/tidas-import/**
        - crates/tidas-references/**
        - crates/tidas-runtime/**
        - crates/tidas-validation/**
        - contracts/import-*.schema.json
        - assets/**
    export:
      paths:
        - crates/tidas-cli/**
        - crates/tidas-export/**
        - crates/tidas-contracts/**
        - crates/tidas-runtime/**
        - contracts/export-report.v1.schema.json
    validation:
      paths:
        - crates/tidas-cli/**
        - crates/tidas-contracts/**
        - crates/tidas-references/**
        - crates/tidas-runtime/**
        - crates/tidas-rulesets/**
        - crates/tidas-validation/**
        - crates/tidas-xml/**
        - contracts/**
        - assets/**
    release-packaging:
      paths:
        - crates/tidas-cli/**
        - crates/tidas-release/**
        - crates/tidas-validation/**
        - crates/tidas-xml/**
        - contracts/release-report.v1.schema.json
        - assets/**
    packaged-assets:
      paths:
        - assets/**
        - crates/tidas-assets/**
        - .gitattributes
    sdk-dispatch:
      paths:
        - .github/workflows/dispatch-tidas-sdk-sync.yml
        - assets/tidas/schemas/**
        - assets/tidas/schemas_zh/**
        - assets/tidas/methodologies/**
    native-distribution:
      paths:
        - LICENSE
        - crates/tidas-dist/**
        - packaging/**
        - .github/releases/**
        - scripts/install.sh
        - scripts/install.ps1
        - scripts/publish-crates.sh
        - scripts/sync-rust-package-assets.sh
        - scripts/test-release-request.sh
        - scripts/validate-release-request.sh
        - scripts/validate-final-python-line.sh
        - .github/workflows/release-request.yml
        - .github/workflows/rust-release.yml
        - .github/actions/native-xml/**
        - scripts/native-cache-contract.sh
        - scripts/test-native-cache.sh
        - scripts/test-publish-target.sh
    proof:
      paths:
        - docs/agents/repo-validation.md
        - scripts/audit-rust-only.sh
        - .githooks/pre-push
        - .github/workflows/rust-ci.yml
        - crates/**
        - contracts/**
        - assets/**
        - migration/**
        - test_data/**
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - README_CN.md
        - .docpact/config.yaml
        - docs/agents/**
        - packaging/README.md
        - migration/**
    local-docpact-gate:
      paths:
        - .githooks/pre-push
        - scripts/docpact
        - scripts/docpact-gate.sh
        - scripts/install-git-hooks.sh
    root-integration:
      paths:
        - AGENTS.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - README_CN.md
    - .docpact/config.yaml
    - docs/agents/cli-contract.md
    - docs/agents/repo-validation.md
    - docs/agents/repo-architecture.md
    - packaging/README.md
    - migration/python-to-rust-owners.md

repo:
  id: tidas-tools
  owner: tidas-tools

rules:
  - id: tidas-tools-bootstrap-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-ai-layer
      - path: docs/agents/**
        kind: deep-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/cli-contract.md
        mode: review_or_update
    reason: Entry guidance, routing, validation, architecture, and CLI contracts must stay aligned.
  - id: tidas-tools-readme-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: README.md
        kind: repo-landing
      - path: README_CN.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: docs/agents/cli-contract.md
        mode: must_exist
    reason: User-facing installation and CLI guidance must reflect the active product.
  - id: tidas-tools-runtime-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: Cargo.toml
        kind: rust-workspace
      - path: Cargo.lock
        kind: dependency-lock
      - path: crates/**
        kind: rust-tooling
      - path: contracts/**
        kind: machine-contract
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/cli-contract.md
        mode: review_or_update
    reason: Product behavior and stable machine contracts determine architecture and proof.
  - id: tidas-tools-asset-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: .gitattributes
        kind: repository-normalization
      - path: assets/**
        kind: executable-asset
      - path: crates/tidas-assets/**
        kind: asset-runtime
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Executable schemas, indexes, XSD, and XSLT require paired and full lock proof.
  - id: tidas-tools-automation-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: .github/releases/**
        kind: release-authorization
      - path: scripts/**
        kind: automation
      - path: .github/workflows/**
        kind: automation
      - path: .github/actions/native-xml/**
        kind: native-dependency-automation
      - path: .githooks/**
        kind: local-gate
      - path: packaging/**
        kind: distribution
      - path: migration/**
        kind: migration-record
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: CI, release, distribution, migration, and local gates must preserve the Rust-only product contract.
