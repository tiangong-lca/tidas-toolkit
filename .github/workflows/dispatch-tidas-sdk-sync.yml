name: Dispatch tidas-sdk Sync

on:
  push:
    branches:
      - main
    paths:
      - "assets/tidas/methodologies/runtime_rulesets.json"
      - "assets/tidas/methodologies/runtime_rulesets.schema.json"
      - "assets/tidas/methodologies/elementary_flow_taxonomy_extension.v1.json"

permissions:
  contents: read

jobs:
  dispatch:
    if: github.repository == 'tiangong-lca/tidas-toolkit' && github.repository_id == '936459656' && github.repository_owner_id == '327771381'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TIDAS_SDK_AUTOMATION_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate automation token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "error: missing TIDAS_SDK_AUTOMATION_TOKEN secret" >&2
            exit 1
          fi

      - name: Detect SDK impact
        id: impact
        env:
          BASE_REF: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$HEAD_REF^"
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_REF" "$HEAD_REF" -- \
            assets/tidas/schemas \
            assets/tidas/schemas_zh \
            assets/tidas/methodologies)"

          if [ -z "$CHANGED_FILES" ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IMPACT_JSON="$(printf '%s\n' "$CHANGED_FILES" | python3 scripts/ci/detect-sdk-impact.py)"
          ANY_CHANGED="$(jq -r '.any_changed' <<<"$IMPACT_JSON")"
          PACKAGES_JSON="$(jq -r '.packages_json' <<<"$IMPACT_JSON")"
          TYPESCRIPT_BUMP="$(jq -r '.typescript_bump' <<<"$IMPACT_JSON")"
          PYTHON_BUMP="$(jq -r '.python_bump' <<<"$IMPACT_JSON")"
          REASON="$(jq -r '.reason' <<<"$IMPACT_JSON")"

          {
            echo "any_changed=$ANY_CHANGED"
            echo "packages_json=$PACKAGES_JSON"
            echo "typescript_bump=$TYPESCRIPT_BUMP"
            echo "python_bump=$PYTHON_BUMP"
            echo "reason=$REASON"
            echo "changed_files<<EOF"
            printf '%s\n' "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stop when nothing affects generated SDKs
        if: steps.impact.outputs.any_changed != 'true'
        run: echo "No SDK-impacting upstream change detected."

      - name: Dispatch sync request to tidas-sdk
        if: steps.impact.outputs.any_changed == 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
          PACKAGES_JSON: ${{ steps.impact.outputs.packages_json }}
          TYPESCRIPT_BUMP: ${{ steps.impact.outputs.typescript_bump }}
          PYTHON_BUMP: ${{ steps.impact.outputs.python_bump }}
          REASON: ${{ steps.impact.outputs.reason }}
        run: |
          jq -n \
            --arg target_sha "$TARGET_SHA" \
            --arg target_ref "$TARGET_REF" \
            --argjson packages "$PACKAGES_JSON" \
            --arg typescript_bump "$TYPESCRIPT_BUMP" \
            --arg python_bump "$PYTHON_BUMP" \
            --arg reason "$REASON" \
            '{
              event_type: "tidas_tools_changed",
              client_payload: {
                tidas_tools_sha: $target_sha,
                tidas_tools_ref: $target_ref,
                packages: $packages,
                typescript_bump: $typescript_bump,
                python_bump: $python_bump,
                reason: $reason
              }
            }' > dispatch.json

          gh api "repos/tiangong-lca/tidas-sdks/dispatches" \
            --method POST \
            --input dispatch.json

      - name: Report dispatched payload
        if: steps.impact.outputs.any_changed == 'true'
        run: |
          echo "Dispatched packages: ${{ steps.impact.outputs.packages_json }}"
          echo "Dispatch reason: ${{ steps.impact.outputs.reason }}"
