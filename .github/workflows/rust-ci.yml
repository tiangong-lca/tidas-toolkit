name: Rust CI

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - contracts/**
      - assets/**
      - migration/**
      - .github/workflows/rust-ci.yml
      - scripts/audit-rust-only.sh
      - .githooks/**
      - scripts/pre-push-deletion-only.sh
      - scripts/test-pre-push.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  # The qualified public-specification candidate. Only these exact bytes are
  # accepted: the archive digest, its manifest digest, and the source revision
  # are pinned in `crates/tidas-assets/src/spec_pin.rs`, and the drift gate below
  # fails if this download does not reproduce them. A branch name is never used
  # as a source of truth.
  TIDAS_SPEC_CANDIDATE_COMMIT: 41e078b63336a31cd8c4bcab748afeb09c19c1e7
  TIDAS_SPEC_CANDIDATE_ARCHIVE: tiangong-lca-tidas-spec-0.1.0.tgz
  TIDAS_SPEC_CANDIDATE_SHA256: 921a0ffa0d3703bc2d9bd8a5bbb02d327be7746177487af8245ac2788a7cf91e

jobs:
  rust:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            family: linux
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            family: linux
          - name: macOS Apple Silicon
            runner: macos-15
            family: macos
          - name: Windows x86_64
            runner: windows-2025
            family: windows

    steps:
      - uses: actions/checkout@v7

      - name: Test pre-push deletion-only classification
        shell: bash
        run: sh scripts/test-pre-push.sh

      - name: Install Linux XML toolchain
        if: matrix.family == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libxml2-dev libxslt1-dev pkg-config

      - name: Install macOS XML toolchain
        if: matrix.family == 'macos'
        run: |
          brew install libxml2 libxslt pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libxslt)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Windows XML toolchain
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source
          vcpkg install libxslt:x64-windows-static
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          vcpkg list

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Audit Rust-only active tree
        if: matrix.name == 'Linux x86_64'
        run: scripts/audit-rust-only.sh

      - name: Check executable asset lock
        run: cargo run --locked -p tidas-assets --bin tidas-asset-lock -- check

      - name: Fetch the qualified public-specification candidate
        if: matrix.name == 'Linux x86_64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tidas-spec-candidate.tgz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/tiangong-lca/tidas-spec/${TIDAS_SPEC_CANDIDATE_COMMIT}/release/${TIDAS_SPEC_CANDIDATE_ARCHIVE}" \
            --output "$archive"
          observed="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$observed" != "$TIDAS_SPEC_CANDIDATE_SHA256" ]; then
            echo "candidate archive digest mismatch: expected $TIDAS_SPEC_CANDIDATE_SHA256, found $observed" >&2
            exit 1
          fi
          echo "TIDAS_SPEC_CANDIDATE_ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

      - name: Check the pinned public-specification copy for drift
        if: matrix.name == 'Linux x86_64'
        run: cargo run --locked -p tidas-assets --bin tidas-asset-lock -- spec-check --archive "$TIDAS_SPEC_CANDIDATE_ARCHIVE_PATH"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets
