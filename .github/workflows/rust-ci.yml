name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - contracts/**
      - assets/**
      - migration/**
      - .github/workflows/rust-ci.yml
      - scripts/audit-rust-only.sh
      - .githooks/**
      - scripts/pre-push-deletion-only.sh
      - scripts/pre-push-maintenance-only.sh
      - scripts/test-pre-push.sh
      - packaging/vcpkg/**
      - .github/actions/native-xml/**
      - .github/workflows/rust-release.yml
      - scripts/native-cache-contract.sh
      - scripts/test-native-cache.sh
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - contracts/**
      - assets/**
      - migration/**
      - .github/workflows/rust-ci.yml
      - scripts/audit-rust-only.sh
      - .githooks/**
      - scripts/pre-push-deletion-only.sh
      - scripts/pre-push-maintenance-only.sh
      - scripts/test-pre-push.sh
      - packaging/vcpkg/**
      - .github/actions/native-xml/**
      - .github/workflows/rust-release.yml
      - scripts/native-cache-contract.sh
      - scripts/test-native-cache.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidas-toolkit-rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan Rust CI lane
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Classify exact Rust CI lane
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          full_matrix='[{"name":"Linux x86_64","runner":"ubuntu-24.04","family":"linux"},{"name":"Linux ARM64","runner":"ubuntu-24.04-arm","family":"linux"},{"name":"macOS Apple Silicon","runner":"macos-15","family":"macos"},{"name":"Windows x86_64","runner":"windows-2025","family":"windows"}]'
          fast_matrix='[{"name":"Linux x86_64","runner":"ubuntu-24.04","family":"linux"}]'

          emit() {
            local mode="$1" reason="$2" matrix="$3"
            echo "Rust CI lane: mode=$mode reason=$reason"
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            emit full "non-pr-event" "$full_matrix"
          fi
          if [ "$HAS_FULL_LABEL" = "true" ]; then
            emit full "ci-full-label" "$full_matrix"
          fi
          if ! [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            emit full "unproven-pr-commits" "$full_matrix"
          fi
          if ! git cat-file -e "${PR_BASE_SHA}^{commit}" || ! git cat-file -e "${PR_HEAD_SHA}^{commit}"; then
            emit full "missing-pr-history" "$full_matrix"
          fi
          changed_count=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            changed_count=$((changed_count + 1))
            case "$file" in
              crates/tidas-contracts/*|crates/tidas-conversion/*|crates/tidas-export/*|crates/tidas-import/*|crates/tidas-references/*|crates/tidas-release/*|crates/tidas-rulesets/*|crates/tidas-assets/*|contracts/*|assets/*|*.md|docs/*|.docpact/*)
                ;;
              *)
                emit full "cross-platform-or-shared-path:$file" "$full_matrix"
                ;;
            esac
          done < <(git diff --name-only --no-renames "${PR_BASE_SHA}...${PR_HEAD_SHA}")
          if [ "$changed_count" -eq 0 ]; then
            emit full "empty-diff" "$full_matrix"
          fi
          emit pr-fast "domain-only-pr" "$fast_matrix"

  rust:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test pre-push exact-range classification
        if: matrix.family != 'windows'
        shell: bash
        run: sh scripts/test-pre-push.sh

      - name: Install Linux XML toolchain
        if: matrix.family == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libxml2-dev libxslt1-dev pkg-config

      - name: Install macOS XML toolchain
        if: matrix.family == 'macos'
        run: |
          brew install libxml2 libxslt pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libxslt)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Identify Windows Rust CI vcpkg cache key
        id: win-vcpkg-cache-key
        if: matrix.family == 'windows'
        shell: bash
        env:
          INPUT_HASH: ${{ hashFiles('.github/actions/native-xml/create-release-triplet.ps1') }}
        run: |
          set -euo pipefail
          echo "key=rust-ci-vcpkg-v2-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-${ImageVersion:-unknown}-${INPUT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore Windows Rust CI vcpkg archives
        if: matrix.family == 'windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/rust-ci-vcpkg-archives
          key: ${{ steps.win-vcpkg-cache-key.outputs.key }}

      - name: Install Windows XML toolchain
        if: matrix.family == 'windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/rust-ci-vcpkg-archives
          VCPKG_BINARY_SOURCES: clear;default,readwrite
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source
          $triplets = Join-Path $env:RUNNER_TEMP "rust-ci-xml-triplets"
          & ./.github/actions/native-xml/create-release-triplet.ps1 -VcpkgRoot $vcpkgRoot -OverlayRoot $triplets
          vcpkg install libxslt:x64-windows-static --overlay-triplets="$triplets"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the Windows XML toolchain." }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          vcpkg list

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Audit Rust-only active tree
        if: matrix.name == 'Linux x86_64'
        run: scripts/audit-rust-only.sh

      - name: Check SDK dispatch path contract
        if: matrix.name == 'Linux x86_64'
        run: bash scripts/ci/test-dispatch-impact.sh

      - name: Check executable asset lock
        run: cargo run --locked -p tidas-assets --bin tidas-asset-lock -- check

      - name: Check public-rule source and toolkit profile composition
        run: cargo run --locked -p tidas-assets --bin tidas-asset-lock -- public-rules-check

      - name: Load the qualified public-specification pin
        if: matrix.name == 'Linux x86_64'
        shell: bash
        run: cargo run --locked -p tidas-assets --bin tidas-asset-lock -- spec-pin-env >> "$GITHUB_ENV"

      - name: Fetch the qualified public-specification candidate
        if: matrix.name == 'Linux x86_64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tidas-spec-candidate.tgz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/tiangong-lca/tidas-spec/${TIDAS_SPEC_CANDIDATE_COMMIT}/release/${TIDAS_SPEC_CANDIDATE_ARCHIVE}" \
            --output "$archive"
          observed="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$observed" != "$TIDAS_SPEC_CANDIDATE_SHA256" ]; then
            echo "candidate archive digest mismatch: expected $TIDAS_SPEC_CANDIDATE_SHA256, found $observed" >&2
            exit 1
          fi
          echo "TIDAS_SPEC_CANDIDATE_ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

      - name: Check the pinned public-specification copy for drift
        if: matrix.name == 'Linux x86_64'
        run: cargo run --locked -p tidas-assets --bin tidas-asset-lock -- spec-check --archive "$TIDAS_SPEC_CANDIDATE_ARCHIVE_PATH"

      - name: Check formatting
        if: matrix.name == 'Linux x86_64'
        run: cargo fmt --all --check

      - name: Lint
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked --workspace --all-targets
