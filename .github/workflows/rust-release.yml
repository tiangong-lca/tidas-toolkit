name: Native Rust Release

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - assets/**
      - LICENSE
      - packaging/**
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/audit-rust-only.sh
      - scripts/publish-crates.sh
      - scripts/sync-rust-package-assets.sh
      - .github/workflows/rust-release.yml
      - .github/actions/native-xml/**
      - scripts/native-cache-contract.sh
      - scripts/test-native-cache.sh
      - scripts/test-publish-target.sh
  push:
    branches: [main]
    paths:
      - packaging/vcpkg/**
      - .github/actions/native-xml/**
      - scripts/native-cache-contract.sh
      - scripts/test-native-cache.sh
      - .github/workflows/rust-release.yml
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidas-toolkit-native-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d

jobs:
  plan:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    name: Plan native release qualification
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Classify exact native release lane
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          emit() {
            echo "Native Rust Release lane: mode=$1 reason=$2"
            echo "mode=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            emit full "non-pr-event"
          fi
          if [ "$HAS_FULL_LABEL" = "true" ]; then
            emit full "ci-full-label"
          fi
          if ! [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            emit full "unproven-pr-commits"
          fi
          if ! git cat-file -e "${PR_BASE_SHA}^{commit}" || ! git cat-file -e "${PR_HEAD_SHA}^{commit}"; then
            emit full "missing-pr-history"
          fi
          changed_count=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            changed_count=$((changed_count + 1))
            case "$file" in
              crates/tidas-contracts/*|crates/tidas-conversion/*|crates/tidas-export/*|crates/tidas-import/*|crates/tidas-references/*|crates/tidas-release/*|crates/tidas-rulesets/*|*.md|docs/*|.docpact/*)
                ;;
              *)
                emit full "release-sensitive-path:$file"
                ;;
            esac
          done < <(git diff --name-only --no-renames "${PR_BASE_SHA}...${PR_HEAD_SHA}")
          if [ "$changed_count" -eq 0 ]; then
            emit full "empty-diff"
          fi
          emit pr-fast "domain-only-pr"

  package-crates:
    needs: plan
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    name: Qualify crates.io release set
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: package-crates-linux

      - name: Install native XML verification dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxml2-dev libxslt1-dev pkg-config

      - name: Audit Rust-only active tree
        run: ./scripts/audit-rust-only.sh

      - name: Test configured Cargo target qualification
        run: bash scripts/test-publish-target.sh

      - name: Package and dry-run the complete public workspace
        run: ./scripts/publish-crates.sh check

  build:
    needs: plan
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && needs.plan.outputs.mode == 'full'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            family: linux
            target: x86_64-unknown-linux-gnu
            vcpkg-triplet: x64-linux
            executable: target/release/tidas
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            family: linux
            target: aarch64-unknown-linux-gnu
            vcpkg-triplet: arm64-linux
            executable: target/release/tidas
          - name: macOS Apple Silicon
            runner: macos-15
            family: macos
            target: aarch64-apple-darwin
            vcpkg-triplet: arm64-osx
            executable: target/release/tidas
          - name: Windows x86_64
            runner: windows-2025
            family: windows
            target: x86_64-pc-windows-msvc
            vcpkg-triplet: x64-windows-static
            executable: target/x86_64-pc-windows-msvc/release/tidas.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rust-src,rust-docs

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: native-release-${{ matrix.target }}

      - name: Install pinned native XML dependencies
        uses: ./.github/actions/native-xml
        with:
          family: ${{ matrix.family }}
          triplet: ${{ matrix.vcpkg-triplet }}
          baseline: ${{ env.VCPKG_COMMIT }}

      - name: Build exact native binary
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          cargo build --locked --release -p tidas --bin tidas

      - name: Reject non-system runtime libraries
        if: matrix.family == 'linux'
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          dependencies="$(ldd "$EXECUTABLE")"
          printf '%s\n' "$dependencies"
          if printf '%s\n' "$dependencies" | grep -E 'libxml2|libxslt|libexslt|vcpkg|/home/runner'; then
            echo "::error::release executable retains a build-machine native dependency"
            exit 1
          fi

      - name: Reject non-system runtime libraries
        if: matrix.family == 'macos'
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          dependencies="$(otool -L "$EXECUTABLE")"
          printf '%s\n' "$dependencies"
          if printf '%s\n' "$dependencies" | grep -E 'libxml2|libxslt|libexslt'; then
            echo "::error::release executable did not statically link the pinned XML toolchain"
            exit 1
          fi
          if printf '%s\n' "$dependencies" | tail -n +2 | grep -Ev '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "::error::release executable retains a non-system native dependency"
            exit 1
          fi

      - name: Package twice and verify exact bytes
        id: package-unix
        if: matrix.family != 'windows'
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
        run: |
          version="$(cargo run --locked --release -p tidas-dist -- version)"
          cargo run --locked --release -p tidas-dist -- notices \
            --binary "$EXECUTABLE" --target "$TARGET" \
            --vcpkg-root "$RUNNER_TEMP/vcpkg" --output-dir dist/notices
          cargo run --locked --release -p tidas-dist -- package \
            --binary "$EXECUTABLE" --license LICENSE --notices-dir dist/notices --target "$TARGET" --output-dir dist/first
          cargo run --locked --release -p tidas-dist -- package \
            --binary "$EXECUTABLE" --license LICENSE --notices-dir dist/notices --target "$TARGET" --output-dir dist/second
          archive="tidas-v${version}-${TARGET}.tar.gz"
          cmp "dist/first/$archive" "dist/second/$archive"
          cmp "dist/first/$archive.sha256" "dist/second/$archive.sha256"
          cargo run --locked --release -p tidas-dist -- verify \
            --archive "dist/first/$archive" \
            --checksum "dist/first/$archive.sha256" \
            --target "$TARGET" --smoke
          mkdir -p dist/upload
          cp "dist/first/$archive" "dist/first/$archive.sha256" dist/upload/
          echo "archive=dist/upload/$archive" >> "$GITHUB_OUTPUT"
          echo "archive-name=$archive" >> "$GITHUB_OUTPUT"

      - name: Package twice and verify exact bytes
        id: package-windows
        if: matrix.family == 'windows'
        shell: pwsh
        env:
          EXECUTABLE: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
        run: |
          $Vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $Dumpbin = & $Vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $Dumpbin) { throw "Cannot inspect Windows native runtime imports." }
          $Imports = & $Dumpbin /DEPENDENTS /IMPORTS $env:EXECUTABLE 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Windows native import inspection failed." }
          $Dlls = [regex]::Matches(($Imports -join "`n"), '(?im)^\s+([A-Za-z0-9_.-]+\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value.ToLowerInvariant() } | Sort-Object -Unique
          if (-not $Dlls) { throw "Windows native import inspection returned no DLLs." }
          Write-Output "Windows native imports: $($Dlls -join ', ')"
          $Unbundled = $Dlls | Where-Object { $_ -match '^(vcruntime|msvcp|msvcr|concrt)[0-9].*\.dll$|^(libxml2|libxslt|libexslt|libiconv.*|iconv|zlib1|lzma)\.dll$' }
          if ($Unbundled) { throw "Windows release retains unbundled native runtime libraries: $($Unbundled -join ', ')" }
          $Version = cargo run --locked --release -p tidas-dist -- version
          cargo run --locked --release -p tidas-dist -- notices `
            --binary $env:EXECUTABLE --target $env:TARGET `
            --vcpkg-root "$env:RUNNER_TEMP\vcpkg" --output-dir dist/notices
          if ($LASTEXITCODE -ne 0) { throw "Native notice collection failed." }
          cargo run --locked --release -p tidas-dist -- package `
            --binary $env:EXECUTABLE --license LICENSE --notices-dir dist/notices --target $env:TARGET --output-dir dist/first
          cargo run --locked --release -p tidas-dist -- package `
            --binary $env:EXECUTABLE --license LICENSE --notices-dir dist/notices --target $env:TARGET --output-dir dist/second
          $Archive = "tidas-v$Version-$env:TARGET.zip"
          $FirstHash = (Get-FileHash -Algorithm SHA256 "dist/first/$Archive").Hash
          $SecondHash = (Get-FileHash -Algorithm SHA256 "dist/second/$Archive").Hash
          if ($FirstHash -ne $SecondHash) { throw "Repeated archive bytes differ." }
          if ((Get-Content -Raw "dist/first/$Archive.sha256") -ne (Get-Content -Raw "dist/second/$Archive.sha256")) {
            throw "Repeated checksum sidecars differ."
          }
          cargo run --locked --release -p tidas-dist -- verify `
            --archive "dist/first/$Archive" `
            --checksum "dist/first/$Archive.sha256" `
            --target $env:TARGET --smoke
          if ($LASTEXITCODE -ne 0) { throw "Native archive verification failed." }
          New-Item -ItemType Directory -Force dist/upload | Out-Null
          Copy-Item "dist/first/$Archive", "dist/first/$Archive.sha256" -Destination dist/upload
          "archive=dist/upload/$Archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive-name=$Archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Smoke in a clean Linux container
        if: matrix.family == 'linux'
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.package-unix.outputs.archive-name }}
          TARGET: ${{ matrix.target }}
        run: |
          version="$(cargo run --locked --release -p tidas-dist -- version)"
          docker run --rm \
            --volume "$PWD/dist/upload:/release:ro" \
            ubuntu:24.04 \
            bash -c "mkdir /tmp/tidas && tar -xzf /release/$ARCHIVE_NAME -C /tmp/tidas && /tmp/tidas/tidas-v$version-$TARGET/bin/tidas --format json version && /tmp/tidas/tidas-v$version-$TARGET/bin/tidas --format json ruleset"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.package-unix.outputs.archive || steps.package-windows.outputs.archive }}
          format: spdx-json
          output-file: dist/upload/${{ steps.package-unix.outputs.archive-name || steps.package-windows.outputs.archive-name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package-unix.outputs.archive || steps.package-windows.outputs.archive }}

      - name: Attest SPDX SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package-unix.outputs.archive || steps.package-windows.outputs.archive }}
          sbom-path: dist/upload/${{ steps.package-unix.outputs.archive-name || steps.package-windows.outputs.archive-name }}.spdx.json

      - name: Upload qualified artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tidas-${{ matrix.target }}
          path: dist/upload/*
          if-no-files-found: error
          retention-days: 14

  seed-native-cache:
    name: Seed native archives (${{ matrix.triplet }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            family: linux
            triplet: x64-linux
          - runner: ubuntu-24.04-arm
            family: linux
            triplet: arm64-linux
          - runner: macos-15
            family: macos
            triplet: arm64-osx
          - runner: windows-2025
            family: windows
            triplet: x64-windows-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-xml
        with:
          family: ${{ matrix.family }}
          triplet: ${{ matrix.triplet }}
          baseline: ${{ env.VCPKG_COMMIT }}

  aggregate:
    name: Aggregate release set
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tidas-*
          path: dist/artifacts
          merge-multiple: true

      - name: Verify complete immutable artifact set
        shell: bash
        run: |
          find dist/artifacts -maxdepth 1 -name '*.sha256' -type f -print0 \
            | sort -z \
            | xargs -0 cat > dist/artifacts/SHA256SUMS
          checksum_count="$(wc -l < dist/artifacts/SHA256SUMS | tr -d ' ')"
          if [ "$checksum_count" -ne 4 ]; then
            echo "::error::expected four release checksums, found $checksum_count"
            exit 1
          fi
          cd dist/artifacts
          sha256sum --check SHA256SUMS

      - name: Validate release tag against Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(cargo run --locked --release -p tidas-dist -- version)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo workspace version $version"
            exit 1
          fi

      - name: Generate package-manager metadata from the same checksums
        shell: bash
        run: |
          version="$(cargo run --locked --release -p tidas-dist -- version)"
          cargo run --locked --release -p tidas-dist -- metadata \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}" \
            --artifacts-dir dist/artifacts \
            --output-dir dist/package-metadata
          ruby -c dist/package-metadata/homebrew/tidas.rb

      - name: Assemble release set
        shell: bash
        run: |
          mkdir -p dist/release
          cp dist/artifacts/* dist/release/
          cp scripts/install.sh scripts/install.ps1 dist/release/
          cp -R dist/package-metadata dist/release/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tidas-release-set
          path: dist/release/**
          if-no-files-found: error
          retention-days: 14

  validate-winget:
    name: Validate Winget metadata
    needs: aggregate
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tidas-release-set
          path: dist/release
      - name: Validate manifests
        shell: pwsh
        run: winget validate dist/release/package-metadata/winget

  publish-crates:
    name: Publish crates.io release set
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - package-crates
      - aggregate
      - validate-winget
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1

      - name: Publish in dependency order with checksum-safe retries
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-crates.sh publish

  publish:
    name: Publish immutable GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - aggregate
      - validate-winget
      - publish-crates
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tidas-release-set
          path: dist/release

      - name: Refuse to mutate an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists and is immutable"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if printf '%s' "$GITHUB_REF_NAME" | grep -q -- '-'; then
            prerelease=(--prerelease)
          fi
          mapfile -d '' assets < <(find dist/release -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "tidas $GITHUB_REF_NAME" \
            "${prerelease[@]}"
