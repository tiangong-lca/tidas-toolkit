[package]
name = "tidas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Unified cross-platform CLI for TIDAS conversion, import, export, validation, and release"
keywords = ["tidas", "lca", "cli", "sustainability"]
categories = ["command-line-utilities", "science"]
publish = ["crates-io"]

[[bin]]
name = "tidas"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
ctrlc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tidas-assets = { version = "=0.3.0", path = "../.." }
tidas-conversion = { version = "=0.3.0", path = "../tidas-conversion" }
tidas-contracts = { version = "=0.3.0", path = "../tidas-contracts" }
tidas-export = { version = "=0.3.0", path = "../tidas-export" }
tidas-import = { version = "=0.3.0", path = "../tidas-import" }
tidas-release = { version = "=0.3.0", path = "../tidas-release" }
tidas-measurement = { version = "=0.3.0", path = "../tidas-measurement" }
tidas-runtime = { version = "=0.3.0", path = "../tidas-runtime" }
tidas-rulesets = { version = "=0.3.0", path = "../tidas-rulesets" }
tidas-validation = { version = "=0.3.0", path = "../tidas-validation" }
tidas-xml = { version = "=0.3.0", path = "../tidas-xml" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
